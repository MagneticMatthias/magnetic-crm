services:
  crm:
    build:
      context: .
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    image: magnetic-crm:latest
    container_name: magnetic-crm
    restart: unless-stopped
    env_file: .env
    ports:
      - "3010:3000"   # im LAN und per Tailscale erreichbar: http://magnetic-nas:3010
