# Magnetic_CRM auf dem NAS. Das Image wird von GitHub gebaut (build-image.yml)
# und hier nur noch gezogen - kein Build mehr auf dem NAS.
services:
  crm:
    image: ghcr.io/magneticmatthias/magnetic-crm:latest
    container_name: magnetic-crm
    restart: unless-stopped
    env_file: .env
    ports:
      - "3010:3000"   # im LAN und per Tailscale erreichbar: http://magnetic-nas:3010
