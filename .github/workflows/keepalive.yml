name: CRM – Supabase wach halten

# Der Free-Plan pausiert ein Projekt nach 7 Tagen ohne Anfrage.
# Dieser Job schickt alle 2 Tage eine Mini-Abfrage, damit das nie passiert.
on:
  schedule:
    - cron: '17 6 */2 * *'   # alle 2 Tage um 06:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase anpingen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Secrets SUPABASE_URL und SUPABASE_ANON_KEY fehlen."; exit 1
          fi
          # Die Abfrage liefert dank RLS eine leere Liste - zaehlt aber als Aktivitaet.
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/organizations?select=id&limit=1")
          echo "Antwort: HTTP $code"
          [ "$code" = "200" ] || { echo "::error::Ping fehlgeschlagen (HTTP $code)"; exit 1; }
